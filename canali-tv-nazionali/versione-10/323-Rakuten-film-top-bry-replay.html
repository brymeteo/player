        .program-slot-container {

        }

        .program-slot-container:first-child {
            width: calc(45% - 10px);

        .program-time-label {

        .program-slot {
            background: linear-gradient(135deg, #1e4b79 0%, #2d5a8a 100%);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            min-height: 47px;
            display: flex;
            flex-direction: column;
            width: 100%;
            justify-content: space-between;
            padding: 4px 6px 0px 6px;
        }

        .program-slot.active::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), #ffffff1a);
            pointer-events: none;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
        }

        .program-slot.selected::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), #ffffff1a);
            pointer-events: none;
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
        }

        .program-slot:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .program-slot.active,
        .program-slot.selected {
            background: linear-gradient(90deg, #BF9F3D 0%, #d7ae2f 100%);
            color: #000000;
            font-weight: 600;
            font-weight: bold;
        }

        .program-slot.active .program-title,
        .program-slot.selected .program-title {
            color: #000;
        }

        .program-title {
            font-size: 17px;
            line-height: 2.1;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .program-slot.active .program-title,
        .program-slot.selected .program-title {
            color: #000;
        }

        .program-slot-timeline {
            margin-top: 10px;
            width: 100%;
        }

        .program-slot-timeline .mini-timeline-container {

            height: 6px;
            border-radius: 3px;
            overflow: hidden;

        }

        .program-slot-timeline .mini-timeline-bar {
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 3px;
            position: relative;
        }

        .program-slot-timeline .mini-timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, #ffffff 0%, #ffffff 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .scroll-indicator {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;

            height: 35px;

            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 900;
        }

        .scroll-indicator:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .scroll-indicator.left {
            left: 5px;
        }

        .scroll-indicator.right {
            right: 5px;
        }

        .scroll-indicator svg {

        .scroll-indicator.hidden {

  /* =====================================================
     CLASSE .hidden — display:none definitivo
     ATTENZIONE: NON usare questa classe su #menu-popup
     direttamente via CSS statico; gestire solo via JS
  ===================================================== */
  .hidden {
    display: none !important;
  }

  #next-program-name {
    color: #c6ced3;
    font-size: 18px;
    margin-top: 4px;
    opacity: 0.85;
  }

  /* =====================================================
     MENU POPUP
     Usa visibility + opacity invece di display:none
     per evitare il flash di chiusura immediata su TV
  ===================================================== */
  #menu-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgb(30 75 121 / 98%);
    padding: 30px;
    border-radius: 15px;
    color: #fff;
    z-index: 10000;
    width: 600px;
    font-family: sans-serif;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    /* Stato iniziale: nascosto senza .hidden,
       così .hidden non interferisce con la transizione */
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0s linear 0.2s;
  }

  #menu-popup.menu-visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.2s ease, visibility 0s linear 0s;
  }

  #menu-popup h2 {
    margin: 0 0 25px 0;
    font-size: 26px;
    text-align: center;
    font-weight: 600;
  }

  .menu-options {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .menu-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255, 255, 255, 0.1);
    padding: 15px 20px;
    border-radius: 8px;
    transition: all 0.3s ease;
    cursor: pointer;
  }

  .menu-option:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: translateX(5px);
  }

  .menu-option-number {
    font-size: 28px;
    font-weight: bold;
    width: 50px;
    text-align: center;
    color: #ffd700;
  }

  .menu-option-content {
    flex: 1;

    flex-direction: column;
    margin-right: 10px;
  }

  .menu-option-title {

    font-weight: 600;
    margin-bottom: 5px;
  }

  .menu-option-desc {
    font-size: 14px;
    opacity: 0.8;
  }

  .menu-option-icon {
    width: 38px;
    height: 38px;
    margin-left: 15px;
    object-fit: contain;
    flex-shrink: 0;
  }

  @media only screen and (max-width: 600px) {

      width: 90%;
      padding: 20px;
    }

      font-size: 20px;

    }
